[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-automation"
version = "0.1.0"
description = "Script d'automatisation de publications Instagram (calendrier CSV -> Instagram Graph API)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alice Dussart" }]
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
