name: Publication Instagram quotidienne

on:
  schedule:
    # 08:00 UTC ~= 09:00 Paris (hiver) / 10:00 Paris (ete) -- cron GitHub ne gere pas
    # les fuseaux horaires. Ajuster ici si une autre heure fixe est souhaitee.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation uniquement (aucune publication, aucun commit)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . -r requirements.txt

      - name: Publier les posts dus
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          # Le cron declenche toujours une execution reelle ; le dispatch manuel
          # simule par defaut (input dry_run=true) sauf si on le desactive explicitement.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python -m instagram_automation

      - name: Committer le calendrier mis a jour
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calendrier.csv
          git diff --staged --quiet || (git commit -m "chore: marque posts publies [skip ci]" && git push)
